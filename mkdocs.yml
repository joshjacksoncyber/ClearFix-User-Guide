site_name: ClearFix User Guide

theme:
    name: material
    logo: img/clearfix-icon-white.png
    favicon: img/favicon.ico
    features:
      - navigation.footer
    palette:
      # Palette toggle for dark mode
      - scheme: slate
        toggle:
          icon: material/toggle-switch
          name: Switch to light mode
        primary: deep purple
        accent: purple
    
      # Palette toggle for light mode
      - scheme: default
        toggle:
          icon: material/toggle-switch-off-outline 
          name: Switch to dark mode
        primary: deep purple
        accent: purple

plugins:
    - search
    - awesome-nav

markdown_extensions:
    - attr_list
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - admonition
    - pymdownx.details
    
extra:
    social:
      - icon: fontawesome/brands/linkedin
        link: https://www.linkedin.com/company/clearloopsecurity/
        name: Follow Clear Loop Security on LinkedIn
    generator: false

copyright: Copyright &copy; 2026 Clear Loop Security